services:
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env            # n8n lee margen, URLs, etc. con $env.VARIABLE
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Argentina/Mendoza
      - TZ=America/Argentina/Mendoza
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: [scraper]

  scraper:
    build: ./scraper
    restart: unless-stopped
    env_file: .env
    shm_size: 1gb             # Chromium necesita memoria compartida
    init: true                # limpia los procesos zombie de Chromium (sin esto se acumulan miles)
    pids_limit: 512
    mem_limit: 4g
    cpus: 4

volumes:
  n8n_data:
