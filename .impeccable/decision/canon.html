<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#fff;color:#111827;font-family:system-ui,sans-serif;overflow:hidden}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 64px;border-bottom:1px solid #E5E7EB;font-weight:700}
.hero{margin:32px 64px;border-radius:24px;background:#EEF5FB;display:grid;grid-template-columns:1fr 1fr;padding:56px;gap:40px;align-items:center}
h1{font-size:56px;line-height:1.05}
p{margin-top:16px;color:#4B5563;font-size:18px}
button{margin-top:28px;background:#1479BC;color:#fff;border:0;border-radius:12px;font:700 16px system-ui;padding:16px 28px}
.ph{height:300px;border-radius:16px;background:#D6E6F3}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:0 64px}
.cats div{border:1px solid #E5E7EB;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.05);font-weight:600}
.cats i{display:block;width:40px;height:40px;border-radius:10px;background:#EEF5FB;margin-bottom:14px}
</style></head><body>
<nav><span>Projaska</span><span style="font-weight:400;color:#6B7280">Productos · Kits · Contacto · Carrito</span></nav>
<section class="hero"><div><h1>Tecnología y seguridad para tu hogar</h1><p>Cámaras, alarmas y cerraduras con envío a todo el país.</p><button>Ver productos</button></div><div class="ph"></div></section>
<section class="cats"><div><i></i>Cámaras</div><div><i></i>Alarmas</div><div><i></i>Cerraduras</div><div><i></i>Kits</div></section>
</body></html>
