<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Plano de instalación</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111518;--blue:#1479BC;--cone:#BFD9EC;--muted:#5F6970}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#fff;color:var(--ink);font-family:Archivo,sans-serif;overflow:hidden;display:grid;grid-template-columns:520px 1fr}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.04em}
aside{border-right:1px solid var(--ink);padding:36px 40px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.04em}.brand i{width:22px;height:22px;border-radius:50%;background:var(--blue)}
h1{font-size:64px;line-height:.95;font-weight:800;font-stretch:110%;margin-top:28px}
.kits{margin-top:28px}.kits div{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #DDE2E5;font-size:16px}
.kits .on{font-weight:700;color:var(--blue)}
.rotulo{border:1px solid var(--ink)}
.rotulo div{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ink);font-size:14px}
.rotulo .p{font-size:36px;font-weight:800;padding:14px}
button{width:100%;background:var(--blue);color:#fff;border:0;font:700 16px Archivo;padding:18px;text-align:left}
main{position:relative;background-image:linear-gradient(#EEF2F4 1px,transparent 1px),linear-gradient(90deg,#EEF2F4 1px,transparent 1px);background-size:24px 24px}
</style></head><body>
<aside>
 <div><div class="brand"><i></i>PROJASKA</div>
  <h1>Tu casa,<br>cubierta<br>de punta a punta.</h1>
  <div class="kits"><div class="on"><span>Kit CCTV 4 cámaras</span><span class="mono">KIT-01</span></div><div><span>Kit Alarma hogar</span><span class="mono">KIT-02</span></div><div><span>Kit Acceso inteligente</span><span class="mono">KIT-03</span></div></div></div>
 <div class="rotulo"><div><span class="mono">PLANO · KIT-01 · datos de ejemplo</span><span class="mono">ESC 1:100</span></div><div class="p">$ 412.900</div><button>Agregar al carrito →</button></div>
</aside>
<main>
<svg viewBox="0 0 920 900" width="920" height="900">
 <g fill="none" stroke="#111518" stroke-width="6"><path d="M120 140H800V760H120Z"/></g>
 <g fill="none" stroke="#111518" stroke-width="2"><path d="M420 140V480M120 480H560M560 480V760M420 330H260"/></g>
 <g fill="#1479BC" fill-opacity=".18" stroke="#1479BC" stroke-width="1">
  <path d="M126 146L360 230L240 380Z"/><path d="M794 146L560 240L700 400Z"/><path d="M794 754L600 600L760 560Z"/><path d="M126 754L330 620L180 560Z"/>
 </g>
 <g fill="#1479BC"><circle cx="126" cy="146" r="9"/><circle cx="794" cy="146" r="9"/><circle cx="794" cy="754" r="9"/><circle cx="126" cy="754" r="9"/><rect x="470" y="500" width="24" height="16"/></g>
 <g font-family="JetBrains Mono" font-size="12" fill="#5F6970"><text x="140" y="125">C1</text><text x="760" y="125">C2</text><text x="760" y="790">C3</text><text x="140" y="790">C4</text><text x="500" y="535">DVR</text><text x="120" y="830">12.40 m</text></g>
</svg>
</main>
</body></html>
